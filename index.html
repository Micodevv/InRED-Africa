<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icône Apple quand le site est ajouté à l'écran d'accueil iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Découvrez InRED Africa, ses missions et ses sept domaines d’action, et trouvez comment devenir bénévole, partenaire ou soutenir ses initiatives."
    />
    <title>InRED Africa | Inclusion, Résilience &amp; Empowerment pour le Développement en Afrique</title>

    <!-- URL canonique : indique à Google quelle est l'adresse officielle du site -->
    <link rel="canonical" href="https://inredafrica.org/" />

    <!-- Open Graph : aperçu quand le lien est partagé (WhatsApp, Facebook, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InRED Africa" />
    <meta property="og:url" content="https://inredafrica.org/" />
    <meta property="og:title" content="InRED Africa | Inclusion, Résilience &amp; Empowerment pour le Développement en Afrique" />
    <meta
      property="og:description"
      content="Découvrez InRED Africa, ses missions et ses sept domaines d’action, et trouvez comment devenir bénévole, partenaire ou soutenir ses initiatives."
    />
    <meta property="og:image" content="https://inredafrica.org/og-image.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InRED Africa | Inclusion, Résilience &amp; Empowerment pour le Développement en Afrique" />
    <meta
      name="twitter:description"
      content="Découvrez InRED Africa, ses missions et ses sept domaines d’action, et trouvez comment devenir bénévole, partenaire ou soutenir ses initiatives."
    />
    <meta name="twitter:image" content="https://inredafrica.org/og-image.jpg" />

    <!-- Aide à l'affichage mobile (barre navigateur) -->
    <meta name="theme-color" content="#0a4a14" />

    <!-- Données structurées : identité de l'organisation pour Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "InRED Africa",
        "url": "https://inredafrica.org/",
        "logo": "https://inredafrica.org/inred-square-logo.jpg",
        "image": "https://inredafrica.org/og-image.jpg",
        "description": "ONG d’inclusion, de résilience et d’empowerment pour le développement en Afrique : éducation, santé, environnement, technologie, collaboration, culture et innovation.",
        "areaServed": "Afrique",
        "knowsLanguage": ["fr", "en"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
